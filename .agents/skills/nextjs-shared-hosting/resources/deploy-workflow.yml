name: Deploy to Shared Hosting

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-shared-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js (standalone)
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://example.com' }}
        run: pnpm build

      - name: Assemble standalone deploy payload
        run: |
          set -e
          rm -rf deploy && mkdir -p deploy/app
          # Copy standalone traced server + node_modules
          cp -r .next/standalone/. deploy/app/
          # Copy static files Next.js omits from standalone output
          mkdir -p deploy/app/.next/static
          cp -r .next/static/. deploy/app/.next/static/
          # Copy public assets if folder exists
          if [ -d public ]; then cp -r public deploy/app/public; fi
          # Copy Passenger startup shim
          cp app.cjs deploy/app.cjs
          # Write restart trigger for Passenger
          mkdir -p deploy/tmp
          echo "restart ${GITHUB_SHA} ${GITHUB_RUN_NUMBER}" > deploy/tmp/restart.txt

      - name: Deploy via FTP/FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          timeout: 120000
          local-dir: ./deploy/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './api/myapp/' }}
          exclude: |
            **/.env
            **/.git/**
            **/.htaccess
            **/.well-known/**
